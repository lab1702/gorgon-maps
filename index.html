<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kloo's Project Gorgon Navigator</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/cytoscape@3/dist/cytoscape.min.js"></script>
  <script src="https://unpkg.com/dagre@0.8/dist/dagre.min.js"></script>
  <script src="https://unpkg.com/cytoscape-dagre@2/cytoscape-dagre.js"></script>
</head>
<body>
  <div id="title">Kloo's Project Gorgon Navigator</div>
  <div id="cy">
    <div id="loading">Loading...</div>
  </div>

  <div id="legend">
    <div class="legend-title">legend</div>
    <div class="legend-item"><span class="legend-circle" style="background:#6dba70"></span> levels 1-10</div>
    <div class="legend-item"><span class="legend-circle" style="background:#b6b84d"></span> levels 11-25</div>
    <div class="legend-item"><span class="legend-circle" style="background:#e4a339"></span> levels 26-40</div>
    <div class="legend-item"><span class="legend-circle" style="background:#e28247"></span> levels 41-60</div>
    <div class="legend-item"><span class="legend-circle" style="background:#d46660"></span> levels 61-75</div>
    <div class="legend-item"><span class="legend-circle" style="background:#9c70bc"></span> levels 76+</div>
    <div class="legend-separator"></div>
    <div class="legend-item"><span class="legend-shape legend-circle-shape"></span> overworld</div>
    <div class="legend-item"><span class="legend-shape legend-square-shape"></span> dungeon</div>
    <div class="legend-separator"></div>
    <div class="legend-hint">click zone to select</div>
    <div class="legend-hint">ctrl+click to select multiple</div>
    <div class="legend-hint">double-click zone to view map</div>
  </div>

  <div id="lightbox">
    <div class="lightbox-header">
      <h2></h2>
      <span class="levels"></span>
      <span class="close-hint">esc to close</span>
      <button class="close-btn">&times;</button>
    </div>
    <div class="lightbox-body">
      <div class="lightbox-loading">Loading map...</div>
      <img src="" alt="">
    </div>
  </div>

  <div id="tooltip"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
